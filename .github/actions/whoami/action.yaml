name: Whoami
description: Muestra los claims del token OIDC, asume el rol de AWS y corre sts get-caller-identity

runs:
  using: composite
  steps:
    - name: Show OIDC claims
      shell: bash
      env:
        GH_ACTOR: ${{ github.actor }}
        GH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        GH_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        echo "github.actor=${GH_ACTOR} github.triggering_actor=${GH_TRIGGERING_ACTOR} run_attempt=${GH_RUN_ATTEMPT}"
        token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
        # Solo el payload: el token firmado no se imprime
        echo "${token}" | cut -d. -f2 | python3 -c '
        import base64, json, sys
        p = sys.stdin.read().strip()
        claims = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
        keys = ["sub", "actor", "actor_id", "event_name", "ref", "environment",
                "workflow_ref", "job_workflow_ref", "repository_id"]
        print(json.dumps({k: claims.get(k) for k in keys}, indent=2))'

    - name: Assume role
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: us-east-2

    - name: Caller identity
      shell: bash
      run: aws sts get-caller-identity
