name: Deploy

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v5
      - run: echo "código no revisado"
      - uses: ./.github/actions/whoami
