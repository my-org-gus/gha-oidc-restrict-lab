name: Evil push
on:
  push:
    branches: [evil2]
permissions:
  contents: read
jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/whoami
